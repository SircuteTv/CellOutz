<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CellOutz — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== Theme system (default + Halloween) ===== */
:root{
  --bg:#0B0000;
  --text:#FF1A1A;
  --red:#FF1A1A;
  --accent:rgba(255,26,26,.15);
  --glow: rgba(255,26,26,.35);
  --matrix: var(--text);
}
html[data-theme="halloween"]{
  --bg:#090107;
  --text:#FF6A00;
  --red:#FF6A00;
  --accent: rgba(255,106,0,.16);
  --glow: rgba(255,106,0,.35);
  --matrix:#B3FF38; /* slime green glyphs */
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Share Tech Mono',monospace;background:var(--bg);color:var(--text);overflow-x:hidden}

/* Sideways Matrix bg canvas */
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:-2;background:var(--bg)}
/* subtle overlays for depth */
.vignette:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 18%, rgba(255,26,26,.12), transparent 55%),
    radial-gradient(1800px 1200px at 50% 110%, rgba(255,26,26,.08), transparent 60%)}
.scan:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(0,0,0,.25) 1px, transparent 1px);
  background-size:100% 3px;mix-blend-mode:soft-light;opacity:.35}

/* Header */
header{display:flex;flex-direction:column;align-items:center;padding:20px 40px 10px;position:relative}
.logo-container{display:flex;justify-content:center;align-items:center;margin-bottom:18px;max-width:100%}
.logo-container img{max-width:440px;width:100%;height:auto;object-fit:contain}
nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
nav a{
  text-decoration:none;color:var(--text);padding:8px 12px;border:1px solid var(--red);border-radius:6px;
  transition:.25s;position:relative}
nav a::after{content:"";position:absolute;inset:0;background:var(--accent);mix-blend-mode:screen;opacity:0;transition:.25s}
nav a:hover{background:var(--red);color:#000;box-shadow:0 0 18px var(--glow), inset 0 0 28px var(--glow)}
nav a:hover::after{opacity:1}
nav .insta-link svg{ width:20px;height:20px; display:block; }

/* Halloween toggle */
.theme-toggle{
  position:fixed; top:18px; right:100px; z-index:3000;
  display:inline-flex; align-items:center; gap:8px; font:12px/1 'Share Tech Mono', monospace;
}
.theme-toggle input{ display:none }
.theme-toggle .track{
  width:54px; height:28px; border-radius:999px; padding:2px;
  border:2px solid var(--red); background:rgba(0,0,0,.35); display:inline-flex; align-items:center;
  box-shadow:0 0 10px var(--glow);
}
.theme-toggle .knob{
  width:22px; height:22px; border-radius:50%; background:var(--red); color:#000;
  display:inline-flex; align-items:center; justify-content:center; font-size:14px;
  transform:translateX(0); transition:transform .18s ease, background .18s ease;
  box-shadow: inset 0 0 10px rgba(0,0,0,.35), 0 0 12px var(--glow);
}
.theme-toggle input:checked + .track .knob{ transform:translateX(26px); background:#B3FF38 }
@media(max-width:600px){ .theme-toggle{ right:14px; top:14px } }

main{max-width:1400px;margin:10px auto 60px;padding:0 18px}

/* Tabs */
.tabs{display:flex;gap:12px;justify-content:center;align-items:center;margin:10px 0 24px}
.tab{
  padding:10px 16px;border:1px solid var(--red);border-radius:999px;background:transparent;color:var(--text);
  cursor:pointer;min-width:90px;text-align:center;box-shadow:0 0 12px rgba(255,26,26,.25)}
.tab.active{background:var(--red);color:#000;box-shadow:0 0 20px var(--glow), inset 0 0 28px var(--accent)}

/* Collection cards */
.collections{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
@media(max-width:1200px){ .collections{grid-template-columns:repeat(3,1fr)} }
@media(max-width:720px){ .collections{grid-template-columns:repeat(2,1fr)} }
@media(max-width:520px){ .collections{grid-template-columns:1fr} }

.col-card{
  position:relative;border:1px solid rgba(255,26,26,.35);border-radius:14px;overflow:hidden;
  background:#000;box-shadow:0 6px 24px rgba(0,0,0,.5); cursor:pointer}
.col-card .thumb{display:block;width:100%;height:180px;object-fit:cover;filter:contrast(1.02) brightness(.96);transition:.25s}
.col-card:hover .thumb{transform:scale(1.03);filter:contrast(1.05) brightness(1.02)}
.col-card .label{
  position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);border:1px solid var(--red);
  color:var(--text);padding:8px 12px;border-radius:12px;backdrop-filter:blur(2px)}
.hide{display:none}

/* Overlay viewer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(2px);display:none;z-index:1500}
.overlay.show{display:block;animation:fade .16s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.viewer{
  position:absolute;inset:20px 20px 60px 20px;
  display:grid;grid-template-columns:1fr auto;gap:16px;border:1px solid rgba(255,26,26,.35);
  border-radius:14px;box-shadow:0 0 28px var(--glow), 0 18px 60px rgba(0,0,0,.6);overflow:hidden}
.viewer.full{grid-template-columns:1fr 0}

.view-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;background:#080000}
.view-img{max-width:100%;max-height:100%;object-fit:contain;display:block}

/* Info panel */
.info{width:min(420px,30vw);background:linear-gradient(180deg, rgba(255,26,26,.06), rgba(0,0,0,.35));padding:16px 16px 24px;overflow:auto}
.info h3{margin:6px 0 8px;font-family:'UnifrakturCook',cursive;font-size:22px}
.info p{margin:0;color:var(--text);line-height:1.35}

/* Controls */
.closeX{
  position:absolute;top:10px;right:14px;width:42px;height:42px;border-radius:10px;border:1px solid var(--red);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.4)}
.infobtn{
  position:absolute;top:10px;left:14px;border:1px solid var(--red);border-radius:999px;background:rgba(0,0,0,.45);
  color:var(--text);padding:8px 12px;cursor:pointer;box-shadow:0 0 10px var(--glow)}
.fsbtn{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:12px;border:1px solid var(--red);border-radius:999px;background:rgba(0,0,0,.45);
  color:var(--text);padding:8px 12px;cursor:pointer}

/* Dagger arrows */
.dagger{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:12px;
  border:1px solid var(--red);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dagger svg{width:26px;height:26px;stroke:currentColor}
.dagger.left{left:12px} .dagger.right{right:12px}
.dagger:hover{box-shadow:0 0 16px var(--glow)}

.title{font-family:'UnifrakturCook',cursive;font-size:22px;margin:18px 6px}
.section{margin-bottom:32px}
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.tile{border:1px solid rgba(255,26,26,.35);border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.tile:hover img{transform:scale(1.03)}
</style>
</head>
<body class="vignette scan">

<canvas id="matrix" aria-hidden="true"></canvas>

<header>
  <div class="logo-container"><a href="index.html"><img src="images/logo.png" alt="CellOutz Logo"></a></div>

  <!-- Theme toggle -->
  <label class="theme-toggle" title="Halloween mode">
    <input id="themeSwitch" type="checkbox" aria-label="Toggle Halloween theme">
    <span class="track"><span class="knob">🎃</span></span>
    <span class="lbl">Halloween</span>
  </label>

  <nav>
    <a href="index.html">Home</a>
    <a href="prints.html">Prints</a>
    <a href="clothes.html">Clothes</a>
    <a class="insta-link" href="https://www.instagram.com/allusionstoograndeur/" target="_blank" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/>
        <circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/>
      </svg>
    </a>
    <a href="blog.html">Blog</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="grandeur">Grandeur</button>
    <button class="tab" data-tab="misc">Misc</button>
  </div>

  <div id="deck" class="collections"></div>
  <div id="sections"></div>
</main>

<!-- Overlay Viewer -->
<div id="overlay" class="overlay" aria-hidden="true">
  <div class="viewer full" id="viewer">
    <div class="view-img-wrap">
      <img id="bigImg" class="view-img" src="" alt="">
    </div>
    <aside class="info" id="infoPanel">
      <h3 id="infoTitle"></h3>
      <p id="infoDesc"></p>
    </aside>
    <button class="infobtn" id="infoToggle">info</button>
    <button class="fsbtn" id="fsBtn">fullscreen</button>
    <button class="closeX" id="closeBtn">✕</button>
    <button class="dagger left" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M12 12L4 8M12 12L4 16"/>
      </svg>
    </button>
    <button class="dagger right" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);">
        <path d="M12 2v20M12 12L4 8M12 12L4 16"/>
      </svg>
    </button>
  </div>
</div>

<script>
/* ===== Theme persistence (shared across pages) ===== */
(function(){
  const KEY='celloutz_theme';
  const html=document.documentElement;
  const input=document.getElementById('themeSwitch');
  const saved=localStorage.getItem(KEY) || 'default';
  if(saved==='halloween'){ html.setAttribute('data-theme','halloween'); if(input) input.checked=true; }
  if(input){
    input.addEventListener('change',()=>{
      const mode=input.checked?'halloween':'default';
      if(mode==='halloween') html.setAttribute('data-theme','halloween');
      else html.removeAttribute('data-theme');
      localStorage.setItem(KEY,mode);
      document.dispatchEvent(new CustomEvent('themechanged',{detail:{mode}}));
    });
  }
})();

/* ===== Sideways Matrix background (theme-aware) ===== */
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const glyphs = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
  let fontSize = 16;
  let rows = 0, pos = [];

  function glyphColor(){
    const v=getComputedStyle(document.documentElement).getPropertyValue('--matrix').trim();
    return v || '#FF1A1A';
  }
  function fit(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    rows = Math.floor(innerHeight / fontSize);
    pos = Array.from({length:rows}, ()=> innerWidth + Math.random()*innerWidth);
  }
  fit();
  addEventListener('resize', fit);

  let raf;
  function step(){
    ctx.fillStyle = "rgba(11,0,0,0.08)";
    ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.fillStyle = glyphColor();
    ctx.font = `${fontSize}px monospace`;

    for(let r=0; r<rows; r++){
      const ch = glyphs[(Math.random()*glyphs.length)|0];
      const y = (r+1)*fontSize - 2;
      ctx.fillText(ch, pos[r], y);
      pos[r] -= fontSize * (0.6 + Math.random()*0.6);
      if (pos[r] < -60) pos[r] = innerWidth + Math.random()*innerWidth;
    }
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ cancelAnimationFrame(raf); } else { raf=requestAnimationFrame(step); }});
  document.addEventListener('themechanged', ()=>{/* color updates next frame */});
})();

/* ===== Smart image loader with aggressive fallbacks ===== */
const enc = s => encodeURIComponent(s);
const joinSeg = (...segs) => segs.map(enc).join('/');

function makeSmartImg(folderCandidates, fileBaseCandidates, extCandidates, className="", alt=""){
  const img = document.createElement('img');
  if(className) img.className = className;
  img.alt = alt || "";
  img.loading = 'lazy';
  img.decoding = 'async';

  const folders = Array.isArray(folderCandidates) ? folderCandidates : [folderCandidates];
  const bases   = Array.isArray(fileBaseCandidates) ? fileBaseCandidates : [fileBaseCandidates];
  const exts    = Array.isArray(extCandidates) ? extCandidates : [extCandidates];

  const attempts = [];
  for(const f of folders){
    for(const b of bases){
      for(const e of exts){
        attempts.push(`images/${joinSeg(f, `${b}.${e}`)}`);
      }
    }
  }

  let i = 0;
  const tryNext = () => {
    if(i >= attempts.length){ img.remove(); return; }
    img.src = attempts[i] + `?v=${Date.now()%1000}`;
    i++;
  };
  img.addEventListener('error', tryNext);
  tryNext();
  return img;
}

const EXT_LIST = ['webp','jpg','jpeg','png','JPG','JPEG','PNG','WEBP'];

/* ===== Collections (keeps your Selfish & Unsane fallbacks) ===== */
const COLLECTIONS = {
  grandeur: [
    { title:"Present Polarity",
      folders:["Present Polarity"],
      grid:"two",
      files: Array.from({length:4},(_,i)=>({bases:[`art (${i+1})`]}))
    },
    { title:"chaos wizard",
      folders:["chaos wizard","Chaos Wizard"],
      grid:"three",
      files: Array.from({length:9},(_,i)=>({bases:[`chaos (${i+1})`]}))
    },
    { title:"Selfish and Unsane",
      folders:["Selfish and Unsane","selfish and unsane","Selfish & Unsane","selfish & unsane"],
      grid:"four",
      files: Array.from({length:14},(_,i)=>({
        bases:[`self (${i+1})`,`Self (${i+1})`,`selfish (${i+1})`]
      }))
    },
    { title:"Sentience and calamity",
      folders:["Sentience and calamity","Sentience And Calamity"],
      grid:"three",
      files: Array.from({length:5},(_,i)=>({bases:[`war (${i+1})`]}))
    },
    { title:"Unsane",
      folders:["Unsane","unsane"],
      grid:"three",
      files: Array.from({length:5},(_,i)=>({bases:[`unsane (${i+1})`]}))
    },
    { title:"Wollongong Major",
      folders:["Wollongong Major","wollongong major"],
      grid:"three",
      files: Array.from({length:9},(_,i)=>({bases:[`bong (${i+1})`]}))
    },
    { title:"Wollongong minor",
      folders:["Wollongong minor","wollongong minor"],
      grid:"four",
      files: Array.from({length:18},(_,i)=>({bases:[`minor (${i+1})`]}))
    },
    { title:"Genesis",
      folders:["Genesis"],
      grid:"two",
      files:[{bases:["latr"]}]
    },
    { title:"I LOVE MKULTRA",
      folders:["I LOVE MKULTRA","I Love MKULTRA"],
      grid:"two",
      files:[{bases:["mkultra (1)"]},{bases:["mkultra (2)"]}]
    },
    { title:"SWAG#1",
      folders:["SWAG#1","Swag#1","SWAG1","swag1"],
      grid:"two",
      files:[{bases:["SWAG","swag"]}]
    },
  ],
  misc: [
    { title:"Before My Allusions",
      folders:["Before My Allusions","Before My Allusions (2023-2024)"],
      grid:"four",
      files: Array.from({length:18},(_,i)=>({bases:[`old (${i+1})`]}))
    },
    { title:"IngestNutmeg",
      folders:["IngestNutmeg","IngestNutmeg (2024)","ingestnutmeg"],
      grid:"three",
      files: Array.from({length:3},(_,i)=>({bases:[`nutmeg (${i+1})`]}))
    },
  ]
};

/* ===== Build deck + sections ===== */
const deck = document.getElementById('deck');
const sections = document.getElementById('sections');
let currentTab = 'grandeur';

function buildDeck(){
  deck.innerHTML=''; sections.innerHTML='';
  COLLECTIONS[currentTab].forEach((col, idx)=>{
    const card=document.createElement('div'); card.className='col-card';
    const label=document.createElement('div'); label.className='label'; label.textContent=col.title;

    const firstBases = col.files[0]?.bases || ["cover","thumb","index"];
    const thumb = makeSmartImg(col.folders, firstBases, EXT_LIST, 'thumb', col.title);
    card.appendChild(thumb);
    card.appendChild(label);
    card.addEventListener('click',()=>openSection(idx));
    deck.appendChild(card);

    const sec=document.createElement('section'); sec.className='section hide'; sec.dataset.index=idx;
    const h=document.createElement('div'); h.className='title'; h.textContent=col.title;
    const grid=document.createElement('div'); grid.className=`grid ${col.grid}`;
    (col.files||[]).forEach((file,i)=>{
      const tile=document.createElement('div'); tile.className='tile'; tile.dataset.col=idx; tile.dataset.i=i;
      const img = makeSmartImg(col.folders, file.bases, EXT_LIST, '', `${col.title} — ${file.bases[0]}`);
      tile.appendChild(img);
      tile.addEventListener('click',()=>openOverlay(idx,i));
      grid.appendChild(tile);
    });
    sec.appendChild(h); sec.appendChild(grid); sections.appendChild(sec);
  });
}

function openSection(idx){
  sections.querySelectorAll('.section').forEach(s=>s.classList.add('hide'));
  const target=sections.querySelector(`.section[data-index="${idx}"]`);
  if(target){ target.classList.remove('hide'); target.scrollIntoView({behavior:'smooth', block:'start'}); }
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentTab=btn.dataset.tab; buildDeck();
    sections.scrollIntoView({behavior:'smooth', block:'start'});
  });
});
buildDeck();

/* ===== Overlay ===== */
const overlay = document.getElementById('overlay');
const viewer  = document.getElementById('viewer');
const bigImg  = document.getElementById('bigImg');
const infoTitle = document.getElementById('infoTitle');
const infoDesc  = document.getElementById('infoDesc');
const infoToggle= document.getElementById('infoToggle');
const fsBtn     = document.getElementById('fsBtn');

let activeCol=0, activeIdx=0;
function sourceFor(colIndex,imgIndex){
  const c = COLLECTIONS[currentTab][colIndex];
  const bases = c.files[imgIndex].bases;
  return { folders:c.folders, bases, title:c.title };
}
function setBigImg(folders,bases){
  const img = makeSmartImg(folders, bases, EXT_LIST, '', '');
  const onload = () => { bigImg.src = img.src; img.remove(); };
  img.addEventListener('load', onload, { once:true });
}
function openOverlay(colIdx,imgIdx){
  activeCol=colIdx; activeIdx=imgIdx;
  const s=sourceFor(activeCol,activeIdx);
  setBigImg(s.folders,s.bases);
  infoTitle.textContent=`${s.title} — ${s.bases[0]}`;
  infoDesc.textContent='—';
  viewer.classList.add('full');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden','false');
}
function stepImg(step){
  const data = COLLECTIONS[currentTab][activeCol];
  activeIdx = (activeIdx + step + data.files.length) % data.files.length;
  const s=sourceFor(activeCol,activeIdx);
  setBigImg(s.folders,s.bases);
  infoTitle.textContent=`${s.title} — ${s.bases[0]}`;
}
document.getElementById('prevBtn').addEventListener('click',()=>stepImg(-1));
document.getElementById('nextBtn').addEventListener('click',()=>stepImg(1));
document.getElementById('closeBtn').addEventListener('click',()=>overlay.classList.remove('show'));
overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.classList.remove('show'); });
addEventListener('keydown',e=>{
  if(!overlay.classList.contains('show')) return;
  if(e.key==='Escape') overlay.classList.remove('show');
  if(e.key==='ArrowLeft') stepImg(-1);
  if(e.key==='ArrowRight') stepImg(1);
});
infoToggle.addEventListener('click',()=>viewer.classList.toggle('full'));
fsBtn.addEventListener('click',()=>{ const el=bigImg; if(!document.fullscreenElement){ el.requestFullscreen?.(); } else { document.exitFullscreen?.(); } });
</script>
</body>
</html>
