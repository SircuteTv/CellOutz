<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>CellOutz — Prints</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== THEME SYSTEM ===== */
:root{
  --bg:#0B0000;
  --text:#FF1A1A;
  --red:#FF1A1A;
  --accent: rgba(255,26,26,.15);
  --glow: rgba(255,26,26,.35);
  --matrix: var(--text);
}
html[data-theme="halloween"]{
  --bg:#090107;
  --text:#FF6A00;
  --red:#FF6A00;
  --accent: rgba(255,106,0,.16);
  --glow: rgba(255,106,0,.35);
  --matrix:#B3FF38;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:'Share Tech Mono',monospace;
  background:var(--bg); color:var(--text); overflow-x:hidden;
}

/* MATRIX BACKGROUND */
#matrix{ position:fixed; inset:0; width:100%; height:100%; z-index:-2; background:var(--bg); }
.vignette:before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 18%, rgba(255,26,26,.12), transparent 55%),
    radial-gradient(1800px 1200px at 50% 110%, rgba(255,26,26,.08), transparent 60%);
}
.scan:after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image: linear-gradient(rgba(0,0,0,.25) 1px, transparent 1px);
  background-size:100% 3px; mix-blend-mode:soft-light; opacity:.35;
}
/* HEADER + NAV */
header{
  display:flex; flex-direction:column; align-items:center;
  padding:20px 40px 10px; position:relative
}
.logo-container{
  display:flex; justify-content:center; align-items:center;
  margin-bottom:18px; max-width:100%
}
.logo-container img{
  max-width:440px; width:100%; height:auto; object-fit:contain
}

nav{
  display:flex; gap:12px; flex-wrap:wrap;
  justify-content:center; align-items:center
}
nav a{
  text-decoration:none; color:var(--text);
  padding:8px 12px; border:1px solid var(--red);
  border-radius:6px; transition:.25s;
  position:relative; display:inline-flex; align-items:center; gap:6px;
}
nav a::after{
  content:''; position:absolute; inset:0;
  background:var(--accent); mix-blend-mode:screen;
  opacity:0; transition:.25s
}
nav a:hover::after{ opacity:1 }
nav a:hover{
  background:var(--red); color:#000;
  box-shadow:0 0 18px var(--glow),
             inset 0 0 28px var(--glow)
}

nav .insta-link svg{
  width:20px; height:20px; display:block;
}

/* CART BUBBLE */
#cart-button{
  position:fixed; top:18px; right:24px;
  width:64px; height:64px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:3px solid var(--red); background:rgba(0,0,0,.35);
  cursor:pointer; z-index:2000; transition: transform .12s ease;
}
#cart-button:hover{ transform: scale(1.03) }
#cart-button img{
  width:34px; height:34px;
  object-fit:contain;
  filter: invert(27%) sepia(100%) saturate(7000%) hue-rotate(340deg)
}
#cart-count{
  position:absolute; top:-8px; right:-8px;
  width:22px; height:22px; border-radius:50%;
  background:var(--red); color:#000;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:12px;
}
.hidden{ display:none !important; }

/* THEME TOGGLE */
.theme-toggle{
  position:fixed; top:18px; right:100px;
  display:inline-flex; align-items:center; gap:8px;
  font:12px/1 'Share Tech Mono',monospace;
  z-index:3000; user-select:none;
}
.theme-toggle input{ display:none }
.theme-toggle .track{
  width:54px; height:28px; border-radius:999px;
  border:2px solid var(--red); background:rgba(0,0,0,.35);
  display:inline-flex; align-items:center;
  padding:2px; position:relative;
  box-shadow:0 0 10px var(--glow);
}
.theme-toggle .knob{
  width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--red); color:#000;
  font-size:14px; transform:translateX(0);
  transition: transform .18s ease, background .18s ease;
  box-shadow: inset 0 0 10px rgba(0,0,0,.35),
              0 0 12px var(--glow);
}
.theme-toggle input:checked + .track .knob{
  transform:translateX(26px); background:#B3FF38;
}

@media(max-width:600px){
  .theme-toggle{ right:14px; top:14px; }
}

main{ max-width:1300px; margin:12px auto 80px; padding:0 18px; }

h2.section-title{
  font-family:'UnifrakturCook',cursive;
  text-align:center;
  margin:34px 0 14px;
  text-shadow:0 0 10px var(--red),
               0 0 24px var(--glow);
}

/* GRID */
.grid{ display:grid; gap:18px; }
.grid.three{ grid-template-columns:repeat(3,1fr); }

@media(max-width:820px){
  .grid.three{ grid-template-columns:repeat(2,1fr) }
}
@media(max-width:540px){
  .grid.three{ grid-template-columns:1fr }
}

/* PRODUCT CARD */
.card{
  border:1px solid rgba(255,26,26,.35);
  border-radius:14px;
  overflow:hidden;
  background:#000;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
  display:flex; flex-direction:column;
}
.thumb-wrap{
  position:relative;
  background:#080000;
  display:flex; align-items:center; justify-content:center;
}
.thumb{
  width:100%; height:100%;
  object-fit:cover; display:block;
  aspect-ratio:4/5;
}
.card:hover .thumb{
  filter:contrast(1.05) brightness(1.02)
}
.card-body{
  padding:12px 12px 14px;
  display:flex; flex-direction:column; gap:10px;
}
.card-title{ font-weight:700; font-size:14px; }
.card-collection{ font-size:12px; opacity:.75; }

.row{
  display:flex; gap:10px; align-items:center;
  flex-wrap:wrap;
}
.select, .qty{
  background:rgba(0,0,0,.5);
  color:var(--text);
  border:1px solid var(--red);
  border-radius:8px;
  padding:8px;
}
.price{ margin-left:auto; font-weight:700; }

.btn{
  width:100%; padding:10px;
  border-radius:10px;
  border:1px solid var(--red);
  background:var(--red); color:#000;
  font-weight:700; cursor:pointer;
  box-shadow:0 0 12px var(--glow),
             inset 0 0 24px var(--accent);
  transition:transform .12s ease;
}
.btn:hover{
  transform:translateY(-2px)
}

/* COMING SOON */
.coming-soon-overlay{
  position:absolute; inset:0;
  display:flex; align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.78);
  font-weight:700; font-size:14px;
  color:var(--text);
  letter-spacing:0.16em;
  text-shadow:0 0 10px var(--glow);
  pointer-events:none;
}

.card.coming-soon .btn{
  opacity:0.6; cursor:default;
}
/* MINI CART */
.mini-cart{
  position:fixed; top:90px; right:16px;
  width:260px; max-height:70vh;
  padding:12px; border-radius:14px;
  border:1px solid var(--red);
  background:rgba(0,0,0,0.96);
  box-shadow:0 0 20px var(--glow);
  display:flex; flex-direction:column; gap:8px;
  font-size:12px;
  transform:translateX(120%);
  opacity:0; pointer-events:none;
  transition:transform .18s ease, opacity .18s ease;
  z-index:2100;
}
.mini-cart.open{
  transform:translateX(0); opacity:1; pointer-events:auto;
}
.mini-cart-header{
  display:flex; justify-content:space-between; align-items:center;
  font-weight:700;
}
.mini-cart-close{
  background:transparent; border:1px solid var(--red);
  border-radius:8px; color:var(--text);
  padding:2px 6px; cursor:pointer; font-size:10px;
}
.mini-cart-items{ max-height:38vh; overflow-y:auto; }
.mini-cart-row{
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:6px; margin-bottom:4px;
}
.mini-cart-row .note{ opacity:0.7; }
.mini-cart-footer{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:4px;
}
.mini-cart-total{ font-weight:700; }
.btn-small{
  padding:6px 10px; font-size:11px;
}

@media(max-width:600px){
  .mini-cart{ right:8px; left:8px; width:auto; }
}
</style>
</head>

<body class="vignette scan">

<canvas id="matrix"></canvas>

<header>
  <div class="logo-container">
    <a href="index.html"><img src="images/logo.png" /></a>
  </div>

  <label class="theme-toggle">
    <input id="themeSwitch" type="checkbox">
    <span class="track"><span class="knob">🎃</span></span>
    <span class="lbl">Halloween</span>
  </label>

  <nav>
    <a href="index.html">Home</a>
    <a href="prints.html">Prints</a>
    <a href="clothes.html">Clothes</a>
    <a class="insta-link" href="https://www.instagram.com/allusionstoograndeur/" target="_blank">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/>
        <circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/>
      </svg>
    </a>
    <a href="blog.html">Blog</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div id="cart-button">
    <img src="images/cart.png">
    <div id="cart-count" class="hidden">0</div>
  </div>
</header>

<main>
  <p class="note" style="text-align:center;margin:0 0 10px;">
    All prints are archival. Sizes match the artwork’s aspect ratio. Prices in AUD.
  </p>

  <h2 class="section-title">Chaos Wizard</h2>
  <div class="grid three" id="grid-chaos"></div>
</main>

<!-- MODAL -->
<div id="overlay" class="overlay">
  <div class="viewer full" id="viewer">
    <div class="view-img-wrap">
      <img id="bigImg" class="view-img" src="">
    </div>
    <aside class="side">
      <h3 id="sideTitle"></h3>
      <p id="sideDesc"></p>
      <p class="note" id="dpiNote"></p>
    </aside>
    <button id="closeBtn" class="closeX">✕</button>
  </div>
</div>

<!-- MINI CART -->
<div id="mini-cart" class="mini-cart">
  <div class="mini-cart-header">
    <span>Cart</span>
    <button id="mini-cart-close" class="mini-cart-close">✕</button>
  </div>
  <div id="mini-cart-items" class="mini-cart-items"></div>
  <div class="mini-cart-footer">
    <span id="mini-cart-total" class="mini-cart-total">Total: $0.00 AUD</span>
    <button id="mini-cart-checkout" class="btn btn-small">Checkout</button>
  </div>
</div>

<script>
/* =============== THEME TOGGLE =============== */
(function () {
  const key = "celloutz_theme";
  const html = document.documentElement;
  const sw = document.getElementById("themeSwitch");
  const saved = localStorage.getItem(key);

  if (saved === "halloween") {
    html.setAttribute("data-theme", "halloween");
    if (sw) sw.checked = true;
  }

  if (sw) {
    sw.addEventListener("change", () => {
      if (sw.checked) {
        html.setAttribute("data-theme", "halloween");
        localStorage.setItem(key, "halloween");
      } else {
        html.removeAttribute("data-theme");
        localStorage.setItem(key, "default");
      }
    });
  }
})();

/* =============== MATRIX BACKGROUND =============== */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
let letters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
let fontSize = 16,
  cols,
  drops;

function resizeMatrix() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  cols = Math.floor(canvas.width / fontSize);
  drops = Array(cols).fill(0);
}
resizeMatrix();
addEventListener("resize", resizeMatrix);

function drawMatrix() {
  ctx.fillStyle = "rgba(11,0,0,0.09)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--matrix").trim();
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < cols; i++) {
    const t = letters[(Math.random() * letters.length) | 0];
    ctx.fillText(t, i * fontSize, drops[i]);
    drops[i] += fontSize;
    if (drops[i] > canvas.height && Math.random() > 0.975) drops[i] = 0;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

/* =============== SHIPPING CONFIG =============== */
/* You can tweak these prices/labels if you want later */
const SHIPPING_OPTIONS = {
  aus: { label: "Australia", price: 10.0 },
  intl: { label: "International", price: 24.0 },
};

let selectedShipping = "aus";
let shippingSelectElement = null;

function initShippingSelector() {
  const footer = document.querySelector(".mini-cart-footer");
  if (!footer) return;

  // Wrapper sits above the total + checkout
  const wrapper = document.createElement("div");
  wrapper.style.display = "flex";
  wrapper.style.alignItems = "center";
  wrapper.style.justifyContent = "space-between";
  wrapper.style.gap = "6px";
  wrapper.style.marginBottom = "6px";
  wrapper.style.fontSize = "11px";

  const label = document.createElement("span");
  label.textContent = "Shipping";

  const select = document.createElement("select");
  select.id = "shipping-select";
  select.className = "select";
  select.style.flex = "1";

  Object.entries(SHIPPING_OPTIONS).forEach(([key, cfg]) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = `${cfg.label} (+$${cfg.price.toFixed(2)})`;
    select.appendChild(opt);
  });

  select.value = selectedShipping;
  select.addEventListener("change", () => {
    selectedShipping = select.value;
    renderCart(); // Recalculate total including new shipping
  });

  wrapper.appendChild(label);
  wrapper.appendChild(select);
  footer.parentNode.insertBefore(wrapper, footer);

  shippingSelectElement = select;
}

/* =============== PRODUCTS =============== */
const PRODUCTS = [
  {
    title: "3D-Glass",
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (1).webp",
    desc: "High quality A2 print.",
    basePrice: 55.55,
    stripePriceId: "price_1Sd24I356zBUvSosnvtIu8PR",
  },
  {
    title: "Kill Everything",
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (4).webp",
    desc: "High quality A2 print.",
    basePrice: 55.55,
    stripePriceId: "price_1Sd2CD356zBUvSosfipidxu0",
  },
  {
    title: "FinalFreedom",
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (3).webp",
    desc: "High quality A2 print.",
    basePrice: 55.55,
    stripePriceId: "price_1Sd2EB356zBUvSosMeykru5y",
  },
  {
    title: "Fleshprison",
    comingSoon: true,
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (2).webp",
    desc: "Coming soon.",
  },
  {
    title: "Surfs Up",
    comingSoon: true,
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (5).webp",
    desc: "Coming soon.",
  },
  {
    title: "Mind Body Soul",
    comingSoon: true,
    collection: "Chaos Wizard",
    src: "images/chaos wizard/chaos (6).webp",
    desc: "Coming soon.",
  },
];

/* =============== BUILD PRODUCT CARDS =============== */
const grid = document.getElementById("grid-chaos");

function makeCard(p) {
  const c = document.createElement("div");
  c.className = "card";
  if (p.comingSoon) c.classList.add("coming-soon");

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";

  const img = document.createElement("img");
  img.className = "thumb";
  img.src = p.src;
  img.alt = p.title;
  wrap.appendChild(img);

  if (p.comingSoon) {
    const o = document.createElement("div");
    o.className = "coming-soon-overlay";
    o.textContent = "COMING SOON";
    wrap.appendChild(o);
  }

  wrap.addEventListener("click", () => openModal(p));

  const body = document.createElement("div");
  body.className = "card-body";

  body.innerHTML = `
    <div class="card-title">${p.title}</div>
    <div class="card-collection">${p.collection}</div>
    <div class="row">
      <select class="select"><option>A2</option></select>
      <input type="number" class="qty" value="1" min="1" style="width:70px">
      <div class="price">$${p.basePrice?.toFixed(2) || "--"} AUD</div>
    </div>
    <button class="btn">${p.comingSoon ? "Coming Soon" : "Add to Cart"}</button>
  `;

  if (!p.comingSoon) {
    const btn = body.querySelector(".btn");
    const qtyInput = body.querySelector(".qty");
    btn.addEventListener("click", () => {
      const qty = Math.max(1, parseInt(qtyInput.value || "1", 10));
      addToCart({
        title: p.title,
        qty,
        price: p.basePrice * qty,
        stripePriceId: p.stripePriceId,
      });
    });
  }

  c.appendChild(wrap);
  c.appendChild(body);
  return c;
}

PRODUCTS.forEach((p) => grid.appendChild(makeCard(p)));

/* =============== MODAL VIEWER =============== */
function openModal(p) {
  document.getElementById("bigImg").src = p.src;
  document.getElementById("sideTitle").textContent = p.title;
  document.getElementById("sideDesc").textContent = p.desc || "";
  document.getElementById("overlay").classList.add("show");
}
document.getElementById("closeBtn").onclick = () => {
  document.getElementById("overlay").classList.remove("show");
};

/* =============== CART + MINI CART =============== */
let CART = [];

const cartBtn = document.getElementById("cart-button");
const cartCount = document.getElementById("cart-count");
const miniCart = document.getElementById("mini-cart");
const miniItems = document.getElementById("mini-cart-items");
const miniTotal = document.getElementById("mini-cart-total");
const miniCartClose = document.getElementById("mini-cart-close");
const miniCartCheckout = document.getElementById("mini-cart-checkout");

cartBtn.onclick = () => {
  miniCart.classList.toggle("open");
};

miniCartClose.onclick = () => {
  miniCart.classList.remove("open");
};

function addToCart(item) {
  const existing = CART.find((i) => i.title === item.title);
  if (existing) {
    existing.qty += item.qty;
    existing.price += item.price;
  } else {
    CART.push(item);
  }
  renderCart();
  miniCart.classList.add("open");
}

function renderCart() {
  const qtyTotal = CART.reduce((sum, i) => sum + i.qty, 0);
  if (qtyTotal > 0) {
    cartCount.textContent = qtyTotal;
    cartCount.classList.remove("hidden");
  } else {
    cartCount.classList.add("hidden");
  }

  miniItems.innerHTML = "";
  if (CART.length === 0) {
    miniItems.innerHTML = '<div class="note">Cart is empty.</div>';
    miniTotal.textContent = "Total: $0.00 AUD";
    return;
  }

  let itemTotal = 0;
  CART.forEach((i) => {
    itemTotal += i.price;
    const row = document.createElement("div");
    row.className = "mini-cart-row";
    row.innerHTML = `
      <div>
        <div>${i.title}</div>
        <div class="note">× ${i.qty}</div>
      </div>
      <div>$${i.price.toFixed(2)}</div>
    `;
    miniItems.appendChild(row);
  });

  // Add shipping into displayed total
  const shipCfg = SHIPPING_OPTIONS[selectedShipping] || { price: 0 };
  const finalTotal = itemTotal + shipCfg.price;
  miniTotal.textContent = `Total: $${finalTotal.toFixed(2)} AUD`;
}

/* =============== CHECKOUT (with shipping) =============== */
miniCartCheckout.addEventListener("click", async () => {
  if (!CART.length) return;

  const shipCfg = SHIPPING_OPTIONS[selectedShipping] || { price: 0 };
  const shippingCost = shipCfg.price;

  try {
    const res = await fetch("/create-checkout-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: CART.map((i) => ({
          priceId: i.stripePriceId,
          quantity: i.qty,
        })),
        shippingCost: shippingCost,
      }),
    });

    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      alert("Stripe error: " + (data.error || "Unknown issue"));
      console.error("Stripe response:", data);
    }
  } catch (err) {
    alert("Network error during checkout.");
    console.error("Checkout error:", err);
  }
});

/* =============== INIT =============== */
initShippingSelector();
renderCart();
</script>

</body>
</html>
